name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in this workflow needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs (the comment is the release). Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Fails on high or critical advisories in any dependency.
      - run: npm audit --audit-level=high
